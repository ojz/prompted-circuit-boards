<?xml version="1.0" encoding="UTF-8"?>
<!-- Panel graphics for the DriveFilter prototype. 10 HP = 150 px at Rack 75 DPI.
     Control centres are the hardware grid:
     3 columns at 15 mm and 5 rows at 15.24 mm, both centred on the panel.
     NanoSVG renders no text elements, so every label is drawn in DriveFilter.cpp. -->
<svg xmlns="http://www.w3.org/2000/svg" width="150" height="380" viewBox="0 0 150 380">
  <rect width="150" height="380" fill="#14151a"/>

  <!-- the rail bands, so the usable panel reads correctly at true scale -->
  <rect x="0" y="0" width="150" height="42" fill="#101116"/>
  <rect x="0" y="338" width="150" height="42" fill="#101116"/>
  <line x1="0" y1="42" x2="150" y2="42" stroke="#2a2d38" stroke-width="1"/>
  <line x1="0" y1="338" x2="150" y2="338" stroke="#2a2d38" stroke-width="1"/>

  <!-- three section strips: Distortion, HPF, LPF -->
  <rect x="10.5" y="76" width="40" height="226" rx="5" fill="#1c1e26"/>
  <rect x="55.0" y="76" width="40" height="226" rx="5" fill="#1c1e26"/>
  <rect x="99.5" y="76" width="40" height="226" rx="5" fill="#1c1e26"/>

  <!-- signal-flow spine down each section -->
  <g stroke="#2f3442" stroke-width="1.2" stroke-linecap="round">
    <line x1="30.5" y1="117" x2="30.5" y2="124"/>
    <line x1="30.5" y1="166" x2="30.5" y2="172"/>
    <line x1="30.5" y1="208" x2="30.5" y2="218"/>
    <line x1="30.5" y1="251" x2="30.5" y2="262"/>

    <line x1="75.0" y1="117" x2="75.0" y2="124"/>
    <line x1="75.0" y1="166" x2="75.0" y2="172"/>
    <line x1="75.0" y1="208" x2="75.0" y2="218"/>
    <line x1="75.0" y1="251" x2="75.0" y2="262"/>

    <line x1="119.5" y1="117" x2="119.5" y2="124"/>
    <line x1="119.5" y1="166" x2="119.5" y2="172"/>
    <line x1="119.5" y1="208" x2="119.5" y2="218"/>
    <line x1="119.5" y1="251" x2="119.5" y2="262"/>
  </g>

  <!-- normalled signal flow: DIST OUT -> HPF IN and HPF OUT -> LPF IN -->
  <g stroke="#e8833a" stroke-width="1.1" stroke-dasharray="2 3" fill="none" opacity="0.65">
    <!-- dist out loop to hpf in -->
    <path d="M 30.5 302 L 30.5 320 L 52.0 320 L 52.0 85 L 75.0 85 L 75.0 97"/>
    <!-- hpf out loop to lpf in -->
    <path d="M 75.0 302 L 75.0 320 L 96.5 320 L 96.5 85 L 119.5 85 L 119.5 97"/>
  </g>

  <line x1="10" y1="60" x2="140" y2="60" stroke="#2a2d38" stroke-width="1"/>
</svg>
