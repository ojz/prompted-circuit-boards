<?xml version="1.0" encoding="UTF-8"?>
<!-- Panel graphics for the Break bench tool. 8 HP = 120 px at Rack's 75 DPI.
     Control centres are the shared grid in src/PanelGrid.hpp: 2 columns at
     15 mm, 5 rows at 15.24 mm, both centred on the panel.
     NanoSVG renders no text, so every label is drawn in Break.cpp. -->
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="380" viewBox="0 0 120 380">
  <rect width="120" height="380" fill="#131a16"/>

  <!-- the rail bands, so the usable panel reads correctly at true scale -->
  <rect x="0" y="0" width="120" height="42" fill="#0f1512"/>
  <rect x="0" y="338" width="120" height="42" fill="#0f1512"/>
  <line x1="0" y1="42" x2="120" y2="42" stroke="#2a3630" stroke-width="1"/>
  <line x1="0" y1="338" x2="120" y2="338" stroke="#2a3630" stroke-width="1"/>

  <!-- clock and voice on the left, level and outputs on the right -->
  <rect x="17.35" y="76" width="40" height="226" rx="5" fill="#1b2420"/>
  <rect x="61.64" y="76" width="40" height="226" rx="5" fill="#1b2420"/>

  <!-- the two reserved cells, marked and left empty -->
  <rect x="21" y="176" width="33" height="28" rx="4" fill="none"
        stroke="#39463f" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
  <rect x="65.3" y="176" width="33" height="28" rx="4" fill="none"
        stroke="#39463f" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
  <rect x="65.3" y="221" width="33" height="28" rx="4" fill="none"
        stroke="#39463f" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>

  <!-- the output row, with the envelope out picked out as a modulation source -->
  <rect x="61.64" y="258" width="40" height="44" rx="5" fill="#16281e"/>
  <circle cx="81.64" cy="279.71" r="19" fill="none" stroke="#6fc28a" stroke-width="1.1" opacity="0.5"/>

  <!-- clock into the pattern, pattern into the outputs -->
  <g stroke="#2f3f37" stroke-width="1.2" stroke-linecap="round">
    <line x1="37.35" y1="117" x2="37.35" y2="124"/>
    <line x1="37.35" y1="166" x2="37.35" y2="172"/>
    <line x1="37.35" y1="251" x2="37.35" y2="262"/>
    <line x1="81.64" y1="117" x2="81.64" y2="124"/>
    <line x1="81.64" y1="166" x2="81.64" y2="172"/>
  </g>

  <line x1="14" y1="60" x2="106" y2="60" stroke="#2a3630" stroke-width="1"/>
</svg>
