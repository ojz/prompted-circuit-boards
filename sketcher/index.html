<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module Sketcher</title>
<meta name="description" content="Sketch a module by putting knobs, jacks, switches and LEDs on a grid. Local file, no backend.">
<link rel="stylesheet" href="style.css">
<script src="catalogue.js"></script>
<script src="sketch-core.js"></script>
<script src="sketchbook.js"></script>
</head>
<body>
<header>
  <input type="text" id="name" placeholder="Untitled module" aria-label="Module name" autocomplete="off">
  <div class="spacer"></div>
  <button type="button" id="undo" title="Undo (Ctrl+Z)">Undo</button>
  <button type="button" id="redo" title="Redo (Ctrl+Y)">Redo</button>
</header>

<main>
  <section id="stage">
    <div id="grid" role="grid" aria-label="Module grid"></div>
    <p id="note"></p>
  </section>

  <aside>
    <div class="block">
      <h2>Place</h2>
      <div id="palette" class="palette"></div>
      <p class="hint">Click a part, then click a cell. Click a filled cell to
        rename it. Drag to move. Backspace clears.</p>
    </div>

    <div class="block">
      <h2>Size</h2>
      <div class="stepper">
        <span>Columns</span>
        <button type="button" id="col-less" aria-label="Fewer columns">&minus;</button>
        <output id="col-count">1</output>
        <button type="button" id="col-more" aria-label="More columns">+</button>
      </div>
      <div class="stepper">
        <span>Rows</span>
        <button type="button" id="row-less" aria-label="Fewer rows">&minus;</button>
        <output id="row-count">1</output>
        <button type="button" id="row-more" aria-label="More rows">+</button>
      </div>
      <p class="hint" id="limits"></p>
    </div>

    <div class="block">
      <h2>Modules</h2>
      <ul id="list"></ul>
      <div class="row">
        <button type="button" id="new">New</button>
        <button type="button" id="dup">Copy</button>
        <button type="button" id="del">Delete</button>
      </div>
    </div>

    <div class="block">
      <h2>JSON</h2>
      <div class="row">
        <button type="button" id="copy">Copy</button>
        <button type="button" id="download">Download</button>
        <label class="file">Open<input type="file" id="open" accept=".json,application/json"></label>
      </div>
      <textarea id="paste" rows="5" spellcheck="false" placeholder="Paste a sketch here"></textarea>
      <div class="row">
        <button type="button" id="import-replace">Replace</button>
        <button type="button" id="import-add">Add</button>
        <button type="button" id="handback" class="primary hidden">Send to agent</button>
      </div>
      <p class="hint" id="status"></p>
    </div>
  </aside>
</main>
<script src="sketcher.js"></script>
</body>
</html>
